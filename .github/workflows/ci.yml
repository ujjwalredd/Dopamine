name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/validate_skill.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 bench/report_agentic.py
      - run: git diff --exit-code -- assets/benchmark-agentic-dopamine.svg bench/results/agentic-tuning-summary.json
      - run: python3 -m json.tool bench/results/correctness-regressions.json > /dev/null
